name: lint-commits

# release-please membaca pesan commit (Conventional Commits) untuk menentukan versi dan isi CHANGELOG.
# Workflow ini menolak PR yang judul atau commit-nya tidak sesuai format itu.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Judul PR
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false

  commits:
    name: Pesan commit
    runs-on: ubuntu-latest
    steps:
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
